<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus RPC — Live Discord Preview</title>
  <style>
    :root {
      --bg-page: #06080d;
      --bg-panel: #0e1422;
      --bg-input: #151e32;
      --border-soft: rgba(110, 155, 255, 0.2);
      --text-main: #f3f6fc;
      --text-sub: #b8c4dc;
      --text-muted: #7f8ca6;
      --navy-glow: #2563eb;
      --spotify-green: #1db954;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.16), transparent 45%), var(--bg-page);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px;
    }

    .head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .head h1 {
      margin: 0;
      font-size: 21px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      background: var(--bg-panel);
      color: var(--text-sub);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--navy-glow);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.3);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 22px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .mode-group {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
    }

    input {
      width: 100%;
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 13px;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .btn {
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-soft);
      background: var(--bg-input);
      color: var(--text-main);
    }

    .btn.primary {
      background: var(--navy-glow);
      border-color: transparent;
      color: #ffffff;
    }

    /* Live Discord Preview Card */
    .dc-card {
      width: 100%;
      max-width: 360px;
      background: #111318;
      border: 1px solid rgba(120, 160, 255, 0.2);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .dc-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #b5bac1;
      margin-bottom: 10px;
    }

    .dc-logo {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .dc-body {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .dc-art {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
      background: #1c2230;
      flex-shrink: 0;
    }

    .dc-info {
      flex: 1;
      min-width: 0;
    }

    .dc-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dc-sub {
      font-size: 13px;
      color: #dbdee1;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dc-extra {
      font-size: 12px;
      color: #949ba4;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dc-bar-box {
      margin-top: 9px;
    }

    .dc-bar-track {
      width: 100%;
      height: 4px;
      background: #2b2d31;
      border-radius: 999px;
      overflow: hidden;
    }

    .dc-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--spotify-green);
      border-radius: 999px;
      transition: width 0.25s linear;
    }

    .dc-times {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #949ba4;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .dc-actions {
      margin-top: 12px;
    }

    .dc-spotify-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 7px 10px;
      border-radius: 6px;
      background: #2b2d31;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
    }

    .dc-spotify-btn:hover {
      background: #35373c;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>Nexus RPC Live Preview</h1>
      <div class="tabs">
        <button type="button" class="tab-btn active" data-mode="spotify">Spotify</button>
        <button type="button" class="tab-btn" data-mode="netflix">Netflix</button>
        <button type="button" class="tab-btn" data-mode="crunchyroll">Crunchyroll</button>
        <button type="button" class="tab-btn" data-mode="youtube">YouTube</button>
        <button type="button" class="tab-btn" data-mode="game">Game RPC</button>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="field">
          <label for="art-url">Artwork URL</label>
          <input id="art-url" type="url" placeholder="https://..." />
        </div>

        <div id="group-spotify" class="mode-group">
          <div class="field">
            <label for="sp-song">Song Name</label>
            <input id="sp-song" type="text" value="Midnight City" />
          </div>
          <div class="field">
            <label for="sp-artist">Author / Artist Name</label>
            <input id="sp-artist" type="text" value="M83" />
          </div>
          <div class="row">
            <div class="field">
              <label for="sp-elapsed">Current Time (sec)</label>
              <input id="sp-elapsed" type="number" min="0" value="84" />
            </div>
            <div class="field">
              <label for="sp-duration">Max Duration (sec)</label>
              <input id="sp-duration" type="number" min="1" value="243" />
            </div>
          </div>
          <div class="field">
            <label for="sp-url">Spotify Track URL</label>
            <input id="sp-url" type="url" value="https://open.spotify.com/track/1eyzWsk2MQDrBo6u1R1atT" />
          </div>
          <div class="row">
            <button type="button" id="btn-toggle" class="btn primary">Pause</button>
            <button type="button" id="btn-reset" class="btn">Reset</button>
          </div>
        </div>

        <div id="group-netflix" class="mode-group" style="display: none;">
          <div class="field">
            <label for="nf-title">Show / Movie Title</label>
            <input id="nf-title" type="text" value="Stranger Things" />
          </div>
          <div class="field">
            <label for="nf-sub">Season / Episode</label>
            <input id="nf-sub" type="text" value="S4 E7 · The Massacre at Hawkins Lab" />
          </div>
          <div class="field">
            <label for="nf-extra">Status Text</label>
            <input id="nf-extra" type="text" value="Watching on Netflix" />
          </div>
        </div>

        <div id="group-crunchyroll" class="mode-group" style="display: none;">
          <div class="field">
            <label for="cr-title">Anime Title</label>
            <input id="cr-title" type="text" value="Jujutsu Kaisen" />
          </div>
          <div class="field">
            <label for="cr-sub">Episode Info</label>
            <input id="cr-sub" type="text" value="Episode 41 · Thunderclap" />
          </div>
          <div class="field">
            <label for="cr-extra">Status Text</label>
            <input id="cr-extra" type="text" value="Streaming on Crunchyroll" />
          </div>
        </div>

        <div id="group-youtube" class="mode-group" style="display: none;">
          <div class="field">
            <label for="yt-title">Video Title</label>
            <input id="yt-title" type="text" value="Building Node Servers" />
          </div>
          <div class="field">
            <label for="yt-sub">Channel Name</label>
            <input id="yt-sub" type="text" value="Dev Notes" />
          </div>
          <div class="field">
            <label for="yt-extra">Status Text</label>
            <input id="yt-extra" type="text" value="Watching on YouTube" />
          </div>
        </div>

        <div id="group-game" class="mode-group" style="display: none;">
          <div class="field">
            <label for="gm-title">Game Name</label>
            <input id="gm-title" type="text" value="ELDEN RING" />
          </div>
          <div class="field">
            <label for="gm-sub">Details</label>
            <input id="gm-sub" type="text" value="Exploring Liurnia of the Lakes" />
          </div>
          <div class="field">
            <label for="gm-extra">State</label>
            <input id="gm-extra" type="text" value="In Party" />
          </div>
        </div>
      </div>

      <div class="dc-card">
        <div id="dc-header" class="dc-header"></div>
        <div class="dc-body">
          <img id="dc-art" class="dc-art" src="" alt="Artwork" />
          <div class="dc-info">
            <div id="dc-title" class="dc-title"></div>
            <div id="dc-sub" class="dc-sub"></div>
            <div id="dc-extra" class="dc-extra"></div>
            <div id="dc-spotify-bar" class="dc-bar-box" style="display: none;">
              <div class="dc-bar-track">
                <div id="dc-bar-fill" class="dc-bar-fill"></div>
              </div>
              <div class="dc-times">
                <span id="dc-time-now">0:00</span>
                <span id="dc-time-max">0:00</span>
              </div>
            </div>
          </div>
        </div>
        <div id="dc-actions" class="dc-actions"></div>
      </div>
    </div>
  </div>

  <script>
    const FALLBACK_ART =
      "data:image/svg+xml;utf8," +
      encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><rect width="128" height="128" fill="#182236"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#8fa2c7" font-family="sans-serif" font-size="14">RPC</text></svg>'
      );

    const SPOTIFY_LOGO =
      "data:image/svg+xml;utf8," +
      encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#1DB954"><circle cx="12" cy="12" r="10"/><path fill="#111318" d="M16.5 15.2c-.2.3-.6.4-.9.2-2.5-1.5-5.6-1.9-9.3-1-.4.1-.7-.2-.8-.5-.1-.4.2-.7.5-.8 4.1-.9 7.6-.5 10.4 1.2.3.2.4.6.1.9zm1.2-2.7c-.2.4-.7.5-1.1.3-2.8-1.7-7.1-2.2-10.5-1.2-.4.1-.9-.1-1-.5-.1-.4.1-.9.5-1 3.9-1.2 8.7-.6 11.9 1.4.4.2.5.7.2 1.2zm.1-2.8C14.4 7.7 8.9 7.5 5.7 8.5c-.5.2-1-.1-1.2-.6-.2-.5.1-1 .6-1.2 3.7-1.1 9.8-.9 13.7 1.4.5.3.6.9.4 1.4-.3.4-.9.6-1.4.2z"/></svg>'
      );

    const state = {
      mode: "spotify",
      artUrl: "",
      spSong: "Midnight City",
      spArtist: "M83",
      spElapsed: 84,
      spDuration: 243,
      spUrl: "https://open.spotify.com/track/1eyzWsk2MQDrBo6u1R1atT",
      spPlaying: true,
      nfTitle: "Stranger Things",
      nfSub: "S4 E7 · The Massacre at Hawkins Lab",
      nfExtra: "Watching on Netflix",
      crTitle: "Jujutsu Kaisen",
      crSub: "Episode 41 · Thunderclap",
      crExtra: "Streaming on Crunchyroll",
      ytTitle: "Building Node Servers",
      ytSub: "Dev Notes",
      ytExtra: "Watching on YouTube",
      gmTitle: "ELDEN RING",
      gmSub: "Exploring Liurnia of the Lakes",
      gmExtra: "In Party"
    };

    function fmtTime(secInput) {
      const s = Math.max(0, Math.floor(Number(secInput) || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
      return `${m}:${String(r).padStart(2, "0")}`;
    }

    function spotifyLink() {
      if (state.spUrl && state.spUrl.trim()) return state.spUrl.trim();
      const q = encodeURIComponent(`${state.spSong} ${state.spArtist}`.trim());
      return q ? `https://open.spotify.com/search/${q}` : "https://open.spotify.com";
    }

    function syncTabs() {
      document.querySelectorAll(".tab-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.mode === state.mode);
      });
      document.querySelectorAll(".mode-group").forEach((g) => {
        g.style.display = g.id === `group-${state.mode}` ? "flex" : "none";
      });
    }

    function render() {
      const header = document.getElementById("dc-header");
      const art = document.getElementById("dc-art");
      const title = document.getElementById("dc-title");
      const sub = document.getElementById("dc-sub");
      const extra = document.getElementById("dc-extra");
      const barBox = document.getElementById("dc-spotify-bar");
      const barFill = document.getElementById("dc-bar-fill");
      const timeNow = document.getElementById("dc-time-now");
      const timeMax = document.getElementById("dc-time-max");
      const actions = document.getElementById("dc-actions");

      // Only Spotify shows the progress bar and Play on Spotify button
      barBox.style.display = "none";
      actions.innerHTML = "";
      extra.textContent = "";
      art.src = state.artUrl && state.artUrl.trim() ? state.artUrl.trim() : FALLBACK_ART;

      if (state.mode === "spotify") {
        const maxSec = Math.max(1, Number(state.spDuration) || 1);
        const nowSec = Math.min(maxSec, Math.max(0, Number(state.spElapsed) || 0));
        const pct = (nowSec / maxSec) * 100;

        header.innerHTML = `<img class="dc-logo" src="${SPOTIFY_LOGO}" alt="Spotify" /><span>Listening to Spotify</span>`;
        title.textContent = state.spSong || "Song Name";
        sub.textContent = state.spArtist || "Artist Name";

        barBox.style.display = "block";
        barFill.style.width = `${pct}%`;
        timeNow.textContent = fmtTime(nowSec);
        timeMax.textContent = fmtTime(maxSec);

        const a = document.createElement("a");
        a.className = "dc-spotify-btn";
        a.href = spotifyLink();
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = "Play on Spotify";
        actions.appendChild(a);
        return;
      }

      if (state.mode === "netflix") {
        header.innerHTML = `<span>Watching Netflix</span>`;
        title.textContent = state.nfTitle || "Show / Movie";
        sub.textContent = state.nfSub || "";
        extra.textContent = state.nfExtra || "";
        return;
      }

      if (state.mode === "crunchyroll") {
        header.innerHTML = `<span>Watching Crunchyroll</span>`;
        title.textContent = state.crTitle || "Anime Title";
        sub.textContent = state.crSub || "";
        extra.textContent = state.crExtra || "";
        return;
      }

      if (state.mode === "youtube") {
        header.innerHTML = `<span>Watching YouTube</span>`;
        title.textContent = state.ytTitle || "Video Title";
        sub.textContent = state.ytSub || "";
        extra.textContent = state.ytExtra || "";
        return;
      }

      if (state.mode === "game") {
        header.innerHTML = `<span>Playing a Game</span>`;
        title.textContent = state.gmTitle || "Game Name";
        sub.textContent = state.gmSub || "";
        extra.textContent = state.gmExtra || "";
      }
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.mode = btn.dataset.mode;
        syncTabs();
        render();
      });
    });

    const inputs = [
      ["art-url", "artUrl", "str"],
      ["sp-song", "spSong", "str"],
      ["sp-artist", "spArtist", "str"],
      ["sp-elapsed", "spElapsed", "num"],
      ["sp-duration", "spDuration", "num"],
      ["sp-url", "spUrl", "str"],
      ["nf-title", "nfTitle", "str"],
      ["nf-sub", "nfSub", "str"],
      ["nf-extra", "nfExtra", "str"],
      ["cr-title", "crTitle", "str"],
      ["cr-sub", "crSub", "str"],
      ["cr-extra", "crExtra", "str"],
      ["yt-title", "ytTitle", "str"],
      ["yt-sub", "ytSub", "str"],
      ["yt-extra", "ytExtra", "str"],
      ["gm-title", "gmTitle", "str"],
      ["gm-sub", "gmSub", "str"],
      ["gm-extra", "gmExtra", "str"]
    ];

    inputs.forEach(([id, key, kind]) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("input", () => {
        state[key] = kind === "num" ? Number(el.value) || 0 : el.value;
        render();
      });
    });

    document.getElementById("btn-toggle").addEventListener("click", (e) => {
      state.spPlaying = !state.spPlaying;
      e.target.textContent = state.spPlaying ? "Pause" : "Resume";
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      state.spElapsed = 0;
      const el = document.getElementById("sp-elapsed");
      if (el) el.value = "0";
      render();
    });

    setInterval(() => {
      if (state.mode === "spotify" && state.spPlaying) {
        const maxSec = Math.max(1, Number(state.spDuration) || 1);
        if (state.spElapsed < maxSec) {
          state.spElapsed += 1;
          const el = document.getElementById("sp-elapsed");
          if (el && document.activeElement !== el) el.value = String(state.spElapsed);
          render();
        }
      }
    }, 1000);

    syncTabs();
    render();
  </script>
</body>
</html>
