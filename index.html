<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus RPC - Headless Gateway</title>
  <style>
    :root {
      --bg: #050507;
      --card: #0d0d11;
      --input: #121218;
      --border: #1f1f2a;
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.35);
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
    .container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; width: 100%; max-width: 460px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px var(--red-glow); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .title h1 { margin: 0; font-size: 20px; font-weight: 900; text-transform: uppercase; color: #fff; }
    .title h1 span { color: var(--red); text-shadow: 0 0 10px var(--red); }
    .status-badge { padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; background: #181822; color: var(--muted); border: 1px solid var(--border); text-transform: uppercase; }
    .status-badge.online { background: rgba(34, 197, 94, 0.1); color: #4ade80; border-color: rgba(34, 197, 94, 0.3); box-shadow: 0 0 8px rgba(34, 197, 94, 0.2); }
    .section { background: #09090d; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }

    .user-card { display: flex; align-items: center; justify-content: space-between; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--red); box-shadow: 0 0 8px var(--red-glow); object-fit: cover; }
    .username { font-weight: 700; font-size: 13px; color: #fff; }
    .subtext { font-size: 11px; color: var(--muted); }

    label { display: block; font-size: 10px; font-weight: 800; color: var(--muted); margin: 10px 0 5px; text-transform: uppercase; }
    label:first-child { margin-top: 0; }
    input, select { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--input); color: #fff; font-size: 13px; outline: none; }
    input:focus, select:focus { border-color: var(--red); box-shadow: 0 0 8px var(--red-glow); }
    .game-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--input); }
    .game-item { padding: 9px 12px; border-bottom: 1px solid #1a1a24; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .game-item:hover { background: rgba(239, 68, 68, 0.15); }
    .game-icon { width: 28px; height: 28px; border-radius: 6px; background: #1a1a24; object-fit: cover; }
    .game-meta { display: flex; flex-direction: column; overflow: hidden; }
    .game-title { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .game-id { font-size: 10px; color: var(--muted); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-row { display: flex; gap: 8px; margin-top: 14px; }
    button.action-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: opacity 0.2s; }
    button.action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-red { background: var(--red); color: #fff; box-shadow: 0 0 12px var(--red-glow); }
    .btn-dark { background: #181822; color: var(--muted); border: 1px solid var(--border); }
    .toast { margin-top: 12px; font-size: 12px; text-align: center; color: var(--muted); font-weight: 600; min-height: 16px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title"><h1>Nexus <span>RPC</span></h1></div>
      <div id="connPill" class="status-badge">Offline</div>
    </div>

    <!-- Gateway Login Box -->
    <div id="loginBox" class="section">
      <label>Discord Account Token</label>
      <input type="password" id="tokenInput" placeholder="Paste your account token..." />
      <button id="connectBtn" class="action-btn btn-red" style="margin-top: 10px;" onclick="connectGateway()">Connect Gateway</button>
    </div>

    <!-- Connected User Bar -->
    <div id="connectedBox" class="section hidden">
      <div class="user-card">
        <div class="user-info">
          <img id="userAvatar" class="avatar" src="" alt="" />
          <div>
            <div id="userName" class="username">User</div>
            <div id="activeGameText" class="subtext">Ready to Broadcast</div>
          </div>
        </div>
        <button class="action-btn btn-dark" style="width:auto;padding:6px 10px;font-size:10px;" onclick="disconnectAccount()">Logout</button>
      </div>
    </div>

    <!-- Game Catalog & RPC Controller -->
    <div class="section">
      <label>Search Games (21,000+)</label>
      <input type="text" id="searchInput" placeholder="Search Roblox, Minecraft, Valorant..." oninput="resetAndSearch()" />
      <div id="gameList" class="game-list" onscroll="handleScroll(event)" style="margin-top: 6px;"></div>

      <div class="grid-2">
        <div><label>Game Name</label><input type="text" id="gameName" /></div>
        <div><label>App ID</label><input type="text" id="appId" /></div>
      </div>
      <label>Icon URL</label><input type="text" id="largeImage" />
      <div class="grid-2">
        <div><label>Details</label><input type="text" id="details" /></div>
        <div><label>State</label><input type="text" id="state" /></div>
      </div>
      <div class="grid-2">
        <div><label>Button Label</label><input type="text" id="buttonLabel" /></div>
        <div><label>Button URL</label><input type="text" id="buttonUrl" /></div>
      </div>
      <label>Status Type</label>
      <select id="statusType"><option value="online">Online</option><option value="dnd">DND</option><option value="idle">Idle</option></select>
      <div class="btn-row">
        <button class="action-btn btn-red" onclick="activateGame()">Set Status</button>
        <button class="action-btn btn-dark" onclick="clearGame()">Clear</button>
      </div>
    </div>
    <div id="toast" class="toast"></div>
  </div>

  <script>
    let currentPage = 1, isLoading = false, hasMoreGames = true;

    window.onload = async () => {
      checkStatus();
      loadMoreGames(true);
      const saved = localStorage.getItem('nexus_token');
      if (saved) {
        document.getElementById('tokenInput').value = saved;
        // Auto-connect if token is saved in localStorage
        await connectGateway(true);
      }
    };

    function showToast(msg, err = false) {
      const t = document.getElementById('toast');
      t.style.color = err ? '#f87171' : '#4ade80';
      t.innerText = msg;
    }

    async function checkStatus() {
      const res = await fetch('/status');
      const session = await res.json();
      updateUI(session);
    }

    function updateUI(session) {
      if (session && session.connected) {
        document.getElementById('connPill').className = 'status-badge online';
        document.getElementById('connPill').innerText = 'Connected';
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('connectedBox').classList.remove('hidden');
        document.getElementById('userName').innerText = session.user;
        document.getElementById('userAvatar').src = session.avatar;
        document.getElementById('activeGameText').innerText = session.activeGame ? `Playing ${session.activeGame}` : 'Ready to Broadcast';
      } else {
        document.getElementById('connPill').className = 'status-badge';
        document.getElementById('connPill').innerText = 'Offline';
        document.getElementById('loginBox').classList.remove('hidden');
        document.getElementById('connectedBox').classList.add('hidden');
      }
    }

    async function connectGateway(isAuto = false) {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) {
        if (!isAuto) showToast('Please enter your account token.', true);
        return;
      }

      const btn = document.getElementById('connectBtn');
      if (btn) {
        btn.disabled = true;
        btn.innerText = 'Connecting...';
      }
      showToast('Establishing WebSocket Gateway connection...');

      try {
        localStorage.setItem('nexus_token', token);
        const res = await fetch('/gateway-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const data = await res.json();
        
        if (data.success) {
          showToast('Headless gateway connected!');
          updateUI(data.session);
        } else {
          showToast(data.error || 'Gateway connection failed.', true);
          localStorage.removeItem('nexus_token');
        }
      } catch (err) {
        showToast('Network error during gateway connection.', true);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerText = 'Connect Gateway';
        }
      }
    }

    async function disconnectAccount() {
      localStorage.removeItem('nexus_token');
      await fetch('/disconnect', { method: 'POST' });
      showToast('Gateway disconnected');
      checkStatus();
    }

    async function loadMoreGames(reset = false) {
      if (isLoading || (!hasMoreGames && !reset)) return;
      isLoading = true;
      if (reset) { currentPage = 1; hasMoreGames = true; }
      const q = document.getElementById('searchInput').value;
      const res = await fetch(`/games?q=${encodeURIComponent(q)}&page=${currentPage}`);
      const data = await res.json();
      const list = document.getElementById('gameList');
      if (reset) list.innerHTML = '';
      data.games.forEach(g => {
        const div = document.createElement('div');
        div.className = 'game-item';
        div.innerHTML = `<img class="game-icon" src="${g.icon||''}" loading="lazy" /><div class="game-meta"><span class="game-title">${g.name}</span><span class="game-id">${g.id}</span></div>`;
        div.onclick = () => {
          document.getElementById('gameName').value = g.name;
          document.getElementById('appId').value = g.id;
          document.getElementById('largeImage').value = g.icon || '';
          showToast(`Selected ${g.name}`);
        };
        list.appendChild(div);
      });
      hasMoreGames = data.hasMore;
      currentPage++;
      isLoading = false;
    }

    function resetAndSearch() { loadMoreGames(true); }
    function handleScroll(e) {
      if (e.target.scrollTop + e.target.clientHeight >= e.target.scrollHeight - 20) loadMoreGames();
    }

    async function activateGame() {
      const body = {
        appId: document.getElementById('appId').value,
        gameName: document.getElementById('gameName').value,
        largeImage: document.getElementById('largeImage').value,
        details: document.getElementById('details').value,
        state: document.getElementById('state').value,
        buttonLabel: document.getElementById('buttonLabel').value,
        buttonUrl: document.getElementById('buttonUrl').value,
        statusType: document.getElementById('statusType').value
      };
      const res = await fetch('/set-game', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await res.json();
      if (data.success) { showToast(`Live: ${body.gameName}`); updateUI(data.session); }
      else { showToast(data.error, true); }
    }

    async function clearGame() {
      const res = await fetch('/clear-game', { method: 'POST' });
      const data = await res.json();
      showToast('Cleared status');
      updateUI(data.session);
    }
  </script>
</body>
</html>
