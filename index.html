<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus RPC — Official Game Presence</title>
  <style>
    :root {
      --bg: #0b0d13;
      --card: #131620;
      --input: #0d1017;
      --border: #232838;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #171b2e 0%, var(--bg) 60%);
      color: var(--text);
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .title h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
    .title span { font-size: 12px; color: var(--muted); }
    .pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #1e2230;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .pill.online { background: rgba(34, 197, 94, 0.12); color: #4ade80; border-color: rgba(34, 197, 94, 0.3); }

    .section {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .user-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #232838; object-fit: cover; }
    .username { font-weight: 700; font-size: 14px; }
    .subtext { font-size: 12px; color: var(--muted); }

    label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin: 10px 0 6px; }
    label:first-child { margin-top: 0; }
    input, select {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .game-list {
      max-height: 210px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 8px;
      background: var(--input);
    }
    .game-item {
      padding: 10px 12px;
      border-bottom: 1px solid #191d29;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.15s;
    }
    .game-item:last-child { border-bottom: none; }
    .game-item:hover { background: var(--accent); }
    .game-icon { width: 30px; height: 30px; border-radius: 8px; background: #1e2230; object-fit: cover; flex-shrink: 0; }
    .game-meta { display: flex; flex-direction: column; overflow: hidden; }
    .game-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .game-id { font-size: 11px; opacity: 0.65; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-row { display: flex; gap: 10px; margin-top: 14px; }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success { background: var(--green); color: #052e16; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-sm { width: auto; padding: 8px 14px; font-size: 12px; }

    .toast { margin-top: 12px; font-size: 13px; text-align: center; color: #94a3b8; min-height: 18px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">
        <h1>Nexus RPC</h1>
        <span>21,000+ Official Desktop Games</span>
      </div>
      <div id="connPill" class="pill">Disconnected</div>
    </div>

    <!-- Step 1: Connect Account Box -->
    <div id="loginBox" class="section">
      <label>Discord Account Token</label>
      <input type="password" id="tokenInput" placeholder="Paste your Discord token here..." />
      <div class="btn-row">
        <button class="btn-primary" id="connectBtn" onclick="connectAccount()">Connect Discord Account</button>
      </div>
    </div>

    <!-- Connected User Bar -->
    <div id="connectedBox" class="section hidden">
      <div class="user-bar">
        <div class="user-info">
          <img id="userAvatar" class="avatar" src="" alt="" />
          <div>
            <div id="userName" class="username">User</div>
            <div id="activeGameText" class="subtext">No game active</div>
          </div>
        </div>
        <button class="btn-danger btn-sm" onclick="disconnectAccount()">Disconnect</button>
      </div>
    </div>

    <!-- Step 2: Game Selector & Controls -->
    <div class="section">
      <label>Search Every Desktop Game</label>
      <input type="text" id="searchInput" placeholder="Type Minecraft, GTA V, Valorant, Roblox..." oninput="searchGames()" />
      <div id="gameList" class="game-list"></div>

      <div class="grid-2">
        <div>
          <label>Selected Game</label>
          <input type="text" id="gameName" placeholder="Minecraft" />
        </div>
        <div>
          <label>Application ID</label>
          <input type="text" id="appId" placeholder="App ID" />
        </div>
      </div>

      <label>Game Icon URL (Auto-filled)</label>
      <input type="text" id="largeImage" placeholder="Auto-filled on selection" />

      <div class="grid-2">
        <div>
          <label>Details (Line 1)</label>
          <input type="text" id="details" placeholder="Playing Survival" />
        </div>
        <div>
          <label>State (Line 2)</label>
          <input type="text" id="state" placeholder="Online" />
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>Button Label (Optional)</label>
          <input type="text" id="buttonLabel" placeholder="View Game" />
        </div>
        <div>
          <label>Button URL (Optional)</label>
          <input type="text" id="buttonUrl" placeholder="https://..." />
        </div>
      </div>

      <label>Account Status</label>
      <select id="statusType">
        <option value="online">Online (Green)</option>
        <option value="dnd">Do Not Disturb (Red)</option>
        <option value="idle">Idle (Yellow)</option>
      </select>

      <div class="btn-row">
        <button class="btn-success" onclick="activateGame()">Set Playing Status</button>
        <button class="btn-danger" onclick="clearGame()">Clear Game</button>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script>
    let debounceTimer = null;

    function showToast(text, isError = false) {
      const t = document.getElementById('toast');
      t.style.color = isError ? '#f87171' : '#4ade80';
      t.innerText = text;
    }

    function updateUI(session) {
      const pill = document.getElementById('connPill');
      const loginBox = document.getElementById('loginBox');
      const connectedBox = document.getElementById('connectedBox');

      if (session && session.connected) {
        pill.className = 'pill online';
        pill.innerText = 'Connected';
        loginBox.classList.add('hidden');
        connectedBox.classList.remove('hidden');
        document.getElementById('userName').innerText = session.user;
        document.getElementById('userAvatar').src = session.avatar || '';
        document.getElementById('activeGameText').innerText = session.activeGame
          ? `Playing ${session.activeGame}`
          : 'Ready — Select a game below';
      } else {
        pill.className = 'pill';
        pill.innerText = 'Disconnected';
        loginBox.classList.remove('hidden');
        connectedBox.classList.add('hidden');
      }
    }

    async function checkStatus() {
      const res = await fetch('/status');
      const session = await res.json();
      updateUI(session);
    }

    async function connectAccount() {
      const token = document.getElementById('tokenInput').value;
      const btn = document.getElementById('connectBtn');
      btn.innerText = 'Connecting...';
      btn.disabled = true;

      try {
        const res = await fetch('/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const data = await res.json();
        if (data.success) {
          showToast('Connected! Now pick any game and click Set Playing Status.');
          updateUI(data.session);
        } else {
          showToast(data.error || 'Connection failed.', true);
        }
      } catch (e) {
        showToast('Network error connecting to server.', true);
      } finally {
        btn.innerText = 'Connect Discord Account';
        btn.disabled = false;
      }
    }

    async function disconnectAccount() {
      await fetch('/disconnect', { method: 'POST' });
      showToast('Disconnected from Discord.');
      updateUI({ connected: false });
    }

    function searchGames() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        const q = document.getElementById('searchInput').value;
        const list = document.getElementById('gameList');
        const res = await fetch('/games?q=' + encodeURIComponent(q));
        const games = await res.json();
        list.innerHTML = '';

        if (games.length === 0) {
          list.innerHTML = '<div style="padding:12px;font-size:13px;color:#94a3b8;">No matching games found.</div>';
          return;
        }

        games.forEach(g => {
          const div = document.createElement('div');
          div.className = 'game-item';
          const icon = g.icon
            ? `<img class="game-icon" src="${g.icon}" loading="lazy" />`
            : `<div class="game-icon"></div>`;
          div.innerHTML = `${icon}<div class="game-meta"><span class="game-title">${g.name}</span><span class="game-id">ID: ${g.id}</span></div>`;
          div.onclick = () => {
            document.getElementById('gameName').value = g.name;
            document.getElementById('appId').value = g.id;
            document.getElementById('largeImage').value = g.icon || '';
            showToast(`Selected ${g.name}`);
          };
          list.appendChild(div);
        });
      }, 180);
    }

    async function activateGame() {
      const body = {
        appId: document.getElementById('appId').value,
        gameName: document.getElementById('gameName').value,
        largeImage: document.getElementById('largeImage').value,
        details: document.getElementById('details').value,
        state: document.getElementById('state').value,
        buttonLabel: document.getElementById('buttonLabel').value,
        buttonUrl: document.getElementById('buttonUrl').value,
        statusType: document.getElementById('statusType').value
      };

      const res = await fetch('/set-game', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (data.success) {
        showToast(`Now playing ${body.gameName}!`);
        updateUI(data.session);
      } else {
        showToast(data.error || 'Could not set game.', true);
      }
    }

    async function clearGame() {
      const res = await fetch('/clear-game', { method: 'POST' });
      const data = await res.json();
      showToast('Game activity cleared (still connected).');
      updateUI(data.session);
    }

    searchGames();
    checkStatus();
  </script>
</body>
</html>
